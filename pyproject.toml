[project]
name = "narrate"
version = "0.1.0"
description = "Script-to-audio narration pipeline with per-project cost accounting"
# Pinned to 3.12, which is what this is developed and tested against. The upper
# bound is caution rather than a diagnosed incompatibility — `uv` fetches 3.12
# on its own, so the pin costs a contributor nothing. Worth revisiting once 3.13
# has been exercised properly.
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
]

# `narrate verify` — checking that every word in the script was actually spoken.
# Optional, so the core install stays light: faster-whisper brings CTranslate2
# and onnxruntime (55-130 MB of wheels by platform, no torch) and a speech model of about
# 480 MB that is downloaded only when asked for. Without the extra, verification
# reports itself unavailable and nothing else changes.
#
# onnxruntime stopped shipping Intel-Mac wheels for Python 3.12 after 1.23.2, so
# that one platform is held back. Nowhere else is pinned: faster-whisper already
# requires onnxruntime, and a floor here only locked out platforms — older
# Apple-Silicon macOS — whose newest wheel predates it.
[project.optional-dependencies]
verify = [
    "faster-whisper>=1.2,<2",
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
narrate = "narrate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrate"]

# ---------------------------------------------------------------------------
# Tooling, matching the conventions in ../avitech.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# Upstream code, kept byte-comparable with its source — see its docstring.
extend-exclude = ["src/narrate/verify/_whisper_normalizer.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "B008",      # typer's callable defaults (Option/Argument) are the idiomatic form
    "ASYNC240",  # writing an audio file and stat-ing it are small, deliberate sync IO;
                 # an anyio dependency buys nothing at this concurrency (2-3 in flight)
]

[tool.ruff.lint.per-file-ignores]
# The chunker's abbreviation guard and the probe's audio-tag fixtures contain
# characters ruff reads as ambiguous unicode; they are load-bearing.
"**/chunking.py" = ["RUF001"]
"**/test_*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# Vendored upstream code, deliberately left as it was written.
[[tool.mypy.overrides]]
module = ["narrate.verify._whisper_normalizer"]
ignore_errors = true

# An optional extra, imported lazily; it ships no type information.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "ctranslate2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Resolve the package from src directly. Keeps the suite working even when
# the editable install is broken (see scripts/repair_editable.py).
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "live: spends real API characters — never runs by default",
    "ffmpeg: requires ffmpeg on PATH",
    "stt: loads a real speech-to-text model — needs the verify extra and a downloaded model",
]
