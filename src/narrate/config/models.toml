# Model rate card and capability registry.
#
# Rates live here rather than in code (PRD C6): ElevenLabs repriced during 2026
# and will again, and a price change must not require a code change. Historical
# takes store the rate that was in force when they were generated, so editing
# this file never rewrites the past.
#
# `narrate models --sync` calls GET /v1/models (which costs zero characters) and
# reconciles the `observed_*` fields below, reporting any drift against these
# declared values. It never silently overwrites a rate.
#
# Sources for every value here, verified 2026-08-21:
#   rates          https://elevenlabs.io/pricing/api
#   char limits    https://elevenlabs.io/docs/overview/models
#   stitching      https://elevenlabs.io/docs/eleven-api/guides/how-to/text-to-speech/request-stitching
#   v3 settings    https://elevenlabs.io/docs/eleven-creative/playground/text-to-speech

# ---------------------------------------------------------------------------
# Sound effects (POST /v1/sound-generation).
#
# Billed per second of audio, not per character — a different model from
# narration entirely. The endpoint does return a `character-cost` header, but
# no documentation says what that number means for a per-second product, and
# the docs state the cost "is not influenced by the text input". So cost is
# computed from duration at the published rate and the header is recorded
# separately for reconciliation.
#
# `narrate probe --live --effects` settled what the header contains: it is
# **5 per second, rounded up** (0.5s -> 3, 1.0s -> 5, 1.5s -> 8), not the 40
# credits/second the subscription docs quote. API generations are discounted,
# the same way speech is. `usd_per_minute` below stays the published API rate,
# which is the figure an invoice is denominated in; `narrate cost reconcile`
# is the tiebreak if the two ever disagree. See docs/probe-effects.md.
# ---------------------------------------------------------------------------
[effects]
model_id = "eleven_text_to_sound_v2"
usd_per_minute = 0.12
credits_per_second = 40
min_seconds = 0.5
max_seconds = 30.0
default_prompt_influence = 0.3
# Undocumented; assumed to share the general pool. `maximum-concurrent-requests`
# on a real response is the authority.
concurrency_group = "standard"

[meta]
# Bump when the rate card changes so ledger entries can be traced to a version.
rate_card_version = "2026-08-21"

# The model a new project gets when none is chosen — in the CLI, the API and
# the web form alike. Declared rather than derived from `long_form`, because the
# default is a judgement about narration, not a continuity rating: eleven_v3 has
# no cross-chunk continuity at all, and is still the better narrator. ElevenLabs'
# model guide lists it for "audiobooks & video narration", it honours audio tags,
# and it costs the same as multilingual_v2. Existing projects keep their model.
default_model = "eleven_v3"
# Capabilities below were reconciled against GET /v1/models on 2026-08-21;
# `narrate models --sync` reports no drift as of that check.

# ---------------------------------------------------------------------------
# Multilingual v2 — the seamless option for one long narrator.
#
# The docs call this one "Most stable on long-form generations", it takes a
# 10,000-character request (roughly a third the chunk count of v3 on the same
# script), and crucially it is the only flagship model where request stitching
# works — which is what keeps prosody continuous across chunk boundaries.
# It does not honour audio tags. Not the default (see `default_model`); choose
# it where continuity across chunks matters more than expressive delivery.
# ---------------------------------------------------------------------------
[models.eleven_multilingual_v2]
label = "Multilingual v2"
usd_per_1k = 0.10
credits_per_char = 1.0
max_chars = 10000
chunk_target_min = 6000
chunk_target_max = 9000
request_stitching = true
audio_tags = false
settings_honoured = ["stability", "similarity_boost", "style", "use_speaker_boost", "speed"]
long_form = "best"
languages = 29
concurrency_group = "standard"
note = "Most stable on long-form generations. Request stitching works."

# ---------------------------------------------------------------------------
# Eleven v3 — the default for new projects (see `default_model`).
#
# Two constraints the PRD did not account for, both verbatim from the docs:
#   "Request stitching is not available for the eleven_v3 model."
#   "Speed is not available for the Eleven v3 model."  (likewise similarity
#   and speaker boost)
# So v3 honours `stability` alone and does pacing through audio tags. It has no
# cross-chunk continuity either — see `text_conditioning` below — so each chunk
# is generated on its own.
# ---------------------------------------------------------------------------
[models.eleven_v3]
label = "Eleven v3"
usd_per_1k = 0.10
credits_per_char = 1.0
max_chars = 5000
chunk_target_min = 2000
chunk_target_max = 3500
request_stitching = false
# Verified by `narrate probe --live`: v3 rejects text conditioning too, with
#   400 unsupported_model — "Providing previous_text or next_text is not yet
#   supported with the 'eleven_v3' model."
# So v3 has no cross-chunk continuity mechanism at all.
text_conditioning = false
audio_tags = true
settings_honoured = ["stability"]
# Keep "expressive": the preflight hint for a stranded one-word sentence (the
# "cannot scale. Them." defect, lint.py) fires on expressive models only.
long_form = "expressive"
languages = 70
concurrency_group = "standard"
# Multi-speaker dialogue via POST /v1/text-to-dialogue. The docs are explicit
# that this is "only available on the Eleven v3 model", and that the total
# across all inputs[].text must stay at or below 2,000 characters per request —
# tighter than the 5,000 above, so it needs its own number.
#
# The price is NOT documented. Third-party sources quote roughly $0.184/1k
# against $0.10/1k for plain speech, which is not good enough to bill from.
# The multiplier stays 1.0 and unverified until `narrate probe --live
# --dialogue` reads the `character-cost` header off a real two-turn request —
# exactly how docs/probe-effects.md settled the per-second question for
# effects. An estimate that is wrong by 1.8x is worse than one labelled unsure.
dialogue = true
dialogue_max_chars = 2000
dialogue_cost_multiplier = 1.0
dialogue_cost_verified = false
note = "The default. Richest delivery, audio tags, 70 languages, and the only model that can do multi-speaker dialogue. Each chunk is generated on its own — no cross-chunk continuity."

# ---------------------------------------------------------------------------
# Flash v2.5 — half price, huge requests, flatter delivery.
# ---------------------------------------------------------------------------
[models.eleven_flash_v2_5]
label = "Flash v2.5"
usd_per_1k = 0.05
credits_per_char = 0.5
max_chars = 40000
chunk_target_min = 20000
chunk_target_max = 35000
request_stitching = true
audio_tags = false
# The API reports can_use_style = false and can_use_speaker_boost = false for
# every Flash/Turbo model, which the prose docs do not mention.
settings_honoured = ["stability", "similarity_boost", "speed"]
long_form = "good"
languages = 32
concurrency_group = "turbo"
note = "Half the price of v2/v3, and draws on a separate concurrency pool."

[models.eleven_flash_v2]
label = "Flash v2 (English)"
usd_per_1k = 0.05
credits_per_char = 0.5
max_chars = 30000
chunk_target_min = 15000
chunk_target_max = 25000
request_stitching = true
audio_tags = false
settings_honoured = ["stability", "similarity_boost", "speed"]
long_form = "good"
languages = 1
concurrency_group = "turbo"
note = "English only."

# ---------------------------------------------------------------------------
# v3 Conversational — v3's voice at half the price, built for live dialogue.
#
# GET /v1/models: 5,000 characters, can_do_text_to_speech = true, and a 0.5
# character-cost multiplier, so it works on the plain TTS endpoint at half v3's
# price. That made it look like the obvious choice for narration, and it is not
# one. ElevenLabs documents it as "an ultra-low-latency version of Eleven v3,
# optimized for live, back-and-forth dialogue" — for agents and assistants —
# and its model guide recommends eleven_v3 or eleven_multilingual_v2 for
# "audiobooks & video narration" instead.
#
# A 21-minute episode rendered on it had five defects the input did not: a
# word reduced to noise, two unscripted words, a swapped word, a plural. No
# model is documented as never doing this, so `narrate verify` stays the check
# whatever is chosen — but for narration, prefer eleven_v3.
# ---------------------------------------------------------------------------
[models.eleven_v3_conversational]
label = "v3 Conversational"
usd_per_1k = 0.05
credits_per_char = 0.5
max_chars = 5000
chunk_target_min = 2000
chunk_target_max = 3500
request_stitching = false
# Same eleven_v3 family, so assumed to share v3's rejection of previous_text.
# Conservative: sending nothing is always accepted, sending it may 400.
text_conditioning = false
audio_tags = true
settings_honoured = ["stability", "use_speaker_boost"]
long_form = "expressive"
languages = 70
concurrency_group = "standard_eleven_v3"
note = "Half the price of v3, but documented for live dialogue, not narration — prefer eleven_v3 for long-form. No request stitching."

# ---------------------------------------------------------------------------
# Deprecated. Listed so the CLI can name the replacement instead of failing
# with an opaque error if an old project config still references them.
# ---------------------------------------------------------------------------
[models.eleven_turbo_v2_5]
label = "Turbo v2.5 (deprecated)"
usd_per_1k = 0.05
credits_per_char = 0.5
max_chars = 40000
chunk_target_min = 20000
chunk_target_max = 35000
request_stitching = true
audio_tags = false
settings_honoured = ["stability", "similarity_boost", "speed"]
long_form = "good"
languages = 32
deprecated = true
replacement = "eleven_flash_v2_5"

[models.eleven_turbo_v2]
label = "Turbo v2 (deprecated)"
usd_per_1k = 0.05
credits_per_char = 0.5
max_chars = 30000
chunk_target_min = 15000
chunk_target_max = 25000
request_stitching = true
audio_tags = false
settings_honoured = ["stability", "similarity_boost", "speed"]
long_form = "good"
languages = 1
deprecated = true
replacement = "eleven_flash_v2"
